site_name: ToolCensus
site_description: Open, reproducible health measurements of the public MCP server ecosystem
repo_url: https://github.com/vidhan843426/toolcensus
docs_dir: docs
site_dir: ../build/site
theme:
  name: material
  features: [navigation.sections, content.code.copy]
  palette:
    - scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}
markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
nav:
  - Home: index.md
  - Ecosystem trends: trends.md
  - Servers: servers/index.md
  - Methodology: methodology.md
  - Ethics: ethics.md
  - Download: download.md
