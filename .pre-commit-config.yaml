repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: schemas
        name: JSON Schemas up to date
        entry: uv run toolcensus schemas --check
        language: system
        pass_filenames: false
        files: ^src/toolcensus/models\.py$
