# Per-package launch overrides. Reviewed by a maintainer before merging.
#
#   packages:
#     "<npm name>":
#       bin: <bin name or relative path>      # which bin to start
#       args: ["--stdio"]                     # extra arguments (safe characters only)
#       env: {SOME_VAR: toolcensus-placeholder-not-a-real-secret}
#                                             # placeholders ONLY; real values are rejected in code
#       allow_install_scripts: false          # true only after review
#
# Without an entry, literal `packageArguments` from the package's MCP Registry entry are used.
# Every override used is recorded in the record's `launch.source` field.
packages:
  "@modelcontextprotocol/server-filesystem":
    args: ["/tmp"]
  # Registry entry io.github.firebase/firebase-mcp lists `mcp` under runtimeArguments (meant for
  # the launcher, e.g. npx) instead of packageArguments; the server is started with `firebase mcp`.
  firebase-tools:
    args: ["mcp"]
  # Ships a native .NET binary; the slim base image has no ICU, so .NET needs invariant mode.
  "@azure/mcp":
    args: ["server", "start"]
    env: {DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"}
