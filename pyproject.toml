[project]
name = "toolcensus"
version = "0.1.0"
description = "Reproducible, longitudinal security-hygiene measurement of the public MCP server ecosystem."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "ToolCensus contributors" }]
keywords = ["mcp", "model-context-protocol", "security", "supply-chain", "measurement"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Environment :: Console",
]
dependencies = [
    "mcp>=2.3,<3",
    "typer>=0.15",
    "httpx>=0.28",
    "pydantic>=2.9",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
dataset = ["pyarrow>=18"]
site = ["mkdocs-material>=9.5"]

[project.scripts]
toolcensus = "toolcensus.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
    "types-jsonschema",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolcensus"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]
# E501: the formatter owns line length. S108: /tmp is the sandbox tmpfs mount, not a host temp file.
ignore = ["S603", "S607", "S101", "E501", "S108"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E501"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
markers = ["sandbox: needs a working Docker daemon (integration)"]
addopts = "-m 'not sandbox'"

[tool.coverage.run]
source = ["toolcensus"]
omit = ["*/sandbox/docker.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff.lint.isort]
known-local-folder = ["helpers"]
